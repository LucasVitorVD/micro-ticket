spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-service
              uri: http://catalog-service:8080
              predicates:
                - Path=/api/v1/show/**
            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/api/v1/order/**
